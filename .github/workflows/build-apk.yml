name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Install obfuscator
        run: npm install javascript-obfuscator --save-dev

      - name: Obfuscate app JS before packaging
        run: node scripts/obfuscate.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Gradle to fix duplicate Kotlin stdlib classes
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Prepare source icon for asset generation
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png
          cp icon-512.png assets/icon-foreground.png
          cp icon-512.png assets/splash.png

      - name: Install Capacitor Assets generator
        run: npm install @capacitor/assets --save-dev

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DgreatVerse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore

      - name: Add signing config to Gradle
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                      keyAlias 'dgreatverse'
                      keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DgreatVerse-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk